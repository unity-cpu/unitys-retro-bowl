<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Bowl</title>
    <meta name="description" content="Retro Bowl - Classic arcade football with team management">
    <meta name="theme-color" content="#0a0a0f">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg: #06060a;
            --surface: #0e0e16;
            --border: #1a1a2e;
            --accent: #22c55e;
            --accent-dim: #16a34a;
            --danger: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
            --glow: rgba(34, 197, 94, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
        }

        /* Background atmosphere */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34, 197, 94, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(59, 130, 246, 0.05), transparent);
            pointer-events: none;
            z-index: 0;
        }

        /* Main layout */
        #app {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Top bar */
        #topbar {
            height: 48px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            flex-shrink: 0;
        }

        #topbar .logo {
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 1px;
            text-shadow: 0 0 20px var(--glow);
        }

        #topbar .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tb-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .tb-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(34, 197, 94, 0.08);
        }
        .tb-btn.admin-btn-top {
            border-color: #7f1d1d;
            color: #f87171;
        }
        .tb-btn.admin-btn-top:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        /* Game area */
        #game-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 0;
            position: relative;
        }

        #gm4html5_div_id {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            max-height: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px var(--border),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 80px var(--glow);
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Loading overlay */
        #loading {
            position: absolute;
            inset: 0;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s;
        }
        #loading.hide {
            opacity: 0;
            pointer-events: none;
        }
        #loading .title {
            font-family: 'Press Start 2P', monospace;
            font-size: 18px;
            color: var(--accent);
            margin-bottom: 24px;
            text-shadow: 0 0 30px var(--glow);
        }
        #loading .bar-bg {
            width: 200px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
        }
        #loading .bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
            box-shadow: 0 0 10px var(--glow);
        }
        #loading .hint {
            margin-top: 16px;
            font-size: 12px;
            color: var(--muted);
        }

        /* Admin password modal */
        #pw-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20000;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
        }
        #pw-modal.show { display: flex; }

        #pw-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 32px;
            width: 340px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
        }
        #pw-box h3 {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
            font-weight: 600;
        }
        #pw-box p {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 18px;
        }
        #pw-input {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
        }
        #pw-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--glow);
        }
        #pw-error {
            font-size: 12px;
            color: var(--danger);
            margin-bottom: 10px;
            min-height: 16px;
        }
        #pw-submit {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
        }
        #pw-submit:hover { background: var(--accent-dim); color: #fff; }
        #pw-cancel {
            margin-top: 10px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        #pw-cancel:hover { color: var(--text); }

        /* Admin Panel */
        #admin-panel {
            display: none;
            position: fixed;
            top: 60px;
            right: 16px;
            width: 340px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            z-index: 15000;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 18px;
        }
        #admin-panel.open { display: block; animation: fadeUp 0.2s ease; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        #admin-panel .panel-header h2 {
            font-size: 13px;
            font-weight: 700;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        #admin-panel .close-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
        }
        #admin-panel .close-btn:hover { color: var(--text); }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 12px 0 6px;
        }

        .cheat-btn {
            display: block;
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 6px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-family: inherit;
        }
        .cheat-btn:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.08);
            color: var(--accent);
        }
        .cheat-btn .sub {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            margin-top: 2px;
        }
        .cheat-btn:hover .sub { color: rgba(34, 197, 94, 0.7); }

        .cheat-btn.god {
            border-color: #7f1d1d;
            background: rgba(239, 68, 68, 0.06);
        }
        .cheat-btn.god:hover {
            border-color: var(--danger);
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }

        #admin-status {
            margin-top: 12px;
            padding: 8px 10px;
            background: var(--bg);
            border-radius: 6px;
            font-size: 11px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: var(--accent);
            min-height: 18px;
            line-height: 1.4;
        }
        #admin-status.err { color: var(--danger); }

        /* Scrollbar */
        #admin-panel::-webkit-scrollbar { width: 4px; }
        #admin-panel::-webkit-scrollbar-track { background: transparent; }
        #admin-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        @media (max-width: 600px) {
            #topbar .logo { font-size: 9px; }
            #admin-panel { width: calc(100vw - 24px); right: 12px; }
            #loading .title { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="topbar">
            <div class="logo">RETRO BOWL</div>
            <div class="actions">
                <button class="tb-btn" onclick="toggleFullscreen()">Fullscreen</button>
                <button class="tb-btn admin-btn-top" onclick="requestAdmin()">Admin</button>
            </div>
        </div>

        <div id="game-wrap">
            <div id="gm4html5_div_id">
                <div id="loading">
                    <div class="title">RETRO BOWL</div>
                    <div class="bar-bg"><div class="bar" id="load-bar"></div></div>
                    <div class="hint" id="load-hint">Loading game...</div>
                </div>
                <canvas id="canvas" width="960" height="540">
                    Your browser doesn't support HTML5 canvas.
                </canvas>
            </div>
        </div>
    </div>

    <!-- Password Modal -->
    <div id="pw-modal">
        <div id="pw-box">
            <h3>Admin Access</h3>
            <p>Enter password to unlock the admin panel</p>
            <input type="password" id="pw-input" placeholder="Password" autocomplete="off" onkeydown="if(event.key==='Enter')checkPassword()">
            <div id="pw-error"></div>
            <button id="pw-submit" onclick="checkPassword()">Unlock</button>
            <br>
            <button id="pw-cancel" onclick="closePwModal()">Cancel</button>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel">
        <div class="panel-header">
            <h2>Admin Panel</h2>
            <button class="close-btn" onclick="closeAdmin()">&times;</button>
        </div>

        <div class="section-label">Economy</div>
        <button class="cheat-btn" onclick="adminGiveCredits()">
            Give 1,000,000 Credits
            <span class="sub">Max out credit balance</span>
        </button>
        <button class="cheat-btn" onclick="adminGiveRC()">
            Give 999 Recruitment Credits
            <span class="sub">Unlimited drafting</span>
        </button>
        <button class="cheat-btn" onclick="adminMaxSalaryCap()">
            Max Salary Cap
            <span class="sub">Set cap to 999</span>
        </button>

        <div class="section-label">Roster</div>
        <button class="cheat-btn" onclick="adminMaxRoster()">
            Max All Player Stats
            <span class="sub">Every player 20/20/20/20</span>
        </button>
        <button class="cheat-btn" onclick="adminMaxMorale()">
            Max Morale & Condition
            <span class="sub">Fully rested and happy</span>
        </button>
        <button class="cheat-btn" onclick="adminPerfectFacilities()">
            Upgrade All Facilities
            <span class="sub">Stadium, Training, Rehab</span>
        </button>

        <div class="section-label">Quick</div>
        <button class="cheat-btn god" onclick="adminGodMode()">
            GOD MODE
            <span class="sub">Everything maxed at once</span>
        </button>
        <button class="cheat-btn" onclick="adminUnlockAll()">
            Unlock Full Version
            <span class="sub">Remove all restrictions</span>
        </button>

        <div id="admin-status">Ready — start or load a game first</div>
    </div>

    <script>
        // ========== CONFIG ==========
        var ADMIN_PASSWORD = "admin123";  // <-- change this password
        var adminUnlocked = false;

        // ========== Poki stubs ==========
        window.PokiSDK = {
            init: function() { return Promise.resolve(); },
            gameLoadingStart: function() {},
            gameLoadingFinished: function() {},
            gameLoadingProgress: function() {},
            gameplayStart: function() {},
            gameplayStop: function() {},
            commercialBreak: function() { return Promise.resolve(); },
            rewardedBreak: function() { return Promise.resolve(); },
            displayAd: function() {},
            destroyAd: function() {},
            isAdBlocked: function() { return false; }
        };
        window.poki_init_raw = function() { return 0; };
        window.poki_init = function() {};
        window.pokiSDK = window.PokiSDK;

        // ========== UI helpers ==========
        function toggleFullscreen() {
            var el = document.getElementById('gm4html5_div_id');
            if (!document.fullscreenElement) {
                (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
        }

        function requestAdmin() {
            if (adminUnlocked) {
                document.getElementById('admin-panel').classList.add('open');
            } else {
                document.getElementById('pw-modal').classList.add('show');
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-error').textContent = '';
                setTimeout(function() { document.getElementById('pw-input').focus(); }, 100);
            }
        }

        function closePwModal() {
            document.getElementById('pw-modal').classList.remove('show');
        }

        function checkPassword() {
            var input = document.getElementById('pw-input').value;
            if (input === ADMIN_PASSWORD) {
                adminUnlocked = true;
                closePwModal();
                document.getElementById('admin-panel').classList.add('open');
                setStatus('Access granted');
            } else {
                document.getElementById('pw-error').textContent = 'Incorrect password';
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').classList.remove('open');
        }

        function setStatus(msg, isErr) {
            var el = document.getElementById('admin-status');
            el.textContent = msg;
            el.className = isErr ? 'err' : '';
        }

        // ========== Cheat engine ==========
        function findAndSet(propNames, value) {
            var found = 0;
            for (var key in window) {
                try {
                    var obj = window[key];
                    if (!obj || typeof obj !== 'object') continue;
                    for (var i = 0; i < propNames.length; i++) {
                        var p = propNames[i];
                        if (obj.hasOwnProperty && obj.hasOwnProperty(p) && typeof obj[p] === 'number') {
                            obj[p] = value; found++;
                        }
                    }
                    if (obj.length !== undefined) {
                        for (var j = 0; j < Math.min(obj.length || 0, 600); j++) {
                            var inst = obj[j];
                            if (!inst || typeof inst !== 'object') continue;
                            for (var i = 0; i < propNames.length; i++) {
                                var p = propNames[i];
                                if (typeof inst[p] === 'number') { inst[p] = value; found++; }
                            }
                        }
                    }
                } catch(e) {}
            }
            return found;
        }

        function deepSet(propList, value, maxDepth) {
            var count = 0;
            var visited = new WeakSet();
            function scan(obj, depth) {
                if (!obj || typeof obj !== 'object' || depth > (maxDepth || 7)) return;
                try { if (visited.has(obj)) return; visited.add(obj); } catch(e) { return; }
                try {
                    for (var k in obj) {
                        if (!obj.hasOwnProperty(k)) continue;
                        var v = obj[k];
                        if (typeof v === 'number' && propList.indexOf(k) >= 0) {
                            obj[k] = value; count++;
                        } else if (typeof v === 'object' && v !== null) {
                            scan(v, depth + 1);
                        }
                    }
                } catch(e) {}
            }
            for (var key in window) {
                try {
                    if (typeof window[key] === 'object') scan(window[key], 0);
                } catch(e) {}
            }
            return count;
        }

        function adminGiveCredits() {
            try {
                var n = deepSet(['_Mp','_5N','credits','coins','_D71','purchased_credit','coach_credit','_Qn'], 1000000);
                findAndSet(['credits','coins','_5N','_D71'], 1000000);
                setStatus('Credits → 1,000,000 (' + n + ' values). Switch menus to refresh.');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminGiveRC() {
            try {
                findAndSet(['recruitment_credits','_Mp','max_rc','_Lp','_Jp'], 999);
                setStatus('Recruitment Credits → 999');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminMaxSalaryCap() {
            try {
                findAndSet(['salary_cap','_VO','boost_salary_cap','_MP'], 999);
                setStatus('Salary Cap → 999');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminMaxRoster() {
            try {
                var count = 0;
                var stats = ['skill','speed','strength','stamina','rating','attitude','condition','morale',
                    'skl','spd','str','stm','att','cond','mor','pot','rat',
                    '_Ot1','_rv1','_uv1','_aP1','_bP1','_cP1','_R21','max_skill','max_speed','max_strength','max_stamina'];
                var visited = new WeakSet();
                function scan(obj, depth) {
                    if (!obj || typeof obj !== 'object' || depth > 8) return;
                    try { if (visited.has(obj)) return; visited.add(obj); } catch(e) { return; }
                    try {
                        var hits = 0;
                        for (var i = 0; i < stats.length; i++) {
                            if (typeof obj[stats[i]] === 'number') hits++;
                        }
                        if (hits >= 2) {
                            for (var i = 0; i < stats.length; i++) {
                                var p = stats[i];
                                if (typeof obj[p] === 'number' && obj[p] >= 0 && obj[p] <= 30) {
                                    obj[p] = 20; count++;
                                }
                            }
                            if (typeof obj.starrating === 'number') obj.starrating = 5;
                            if (typeof obj.star_rating === 'number') obj.star_rating = 5;
                            if (typeof obj.star_potential === 'number') obj.star_potential = 5;
                        }
                        if (Array.isArray(obj)) {
                            for (var j = 0; j < obj.length; j++) scan(obj[j], depth + 1);
                        } else {
                            for (var k in obj) {
                                if (typeof obj[k] === 'object') scan(obj[k], depth + 1);
                            }
                        }
                    } catch(e) {}
                }
                for (var key in window) {
                    try { if (typeof window[key] === 'object') scan(window[key], 0); } catch(e) {}
                }
                setStatus('Player stats maxed (' + count + ' values). Check roster.');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminMaxMorale() {
            try {
                findAndSet(['morale','condition','attitude','mor','cond','att','_AY','_V11','_NM1'], 100);
                setStatus('Morale & Condition maxed');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminPerfectFacilities() {
            try {
                findAndSet(['facility_stadium','facility_training','facility_rehab',
                    'facility_upgraded_stadium','facility_upgraded_training','facility_upgraded_rehab',
                    '_JF','_KF','_SF','_TF','_0G','_1G'], 1);
                setStatus('Facilities upgraded');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminUnlockAll() {
            try {
                findAndSet(['rb_full_version','IAP_Enabled','full_version','_li1','_bi1'], 1);
                setStatus('Full version unlocked');
            } catch(e) { setStatus('Error: ' + e.message, true); }
        }

        function adminGodMode() {
            adminGiveCredits();
            adminGiveRC();
            adminMaxSalaryCap();
            adminMaxRoster();
            adminMaxMorale();
            adminPerfectFacilities();
            adminUnlockAll();
            setStatus('GOD MODE ON — everything maxed');
        }

        // ========== Loading bar animation ==========
        (function() {
            var bar = document.getElementById('load-bar');
            var hint = document.getElementById('load-hint');
            var pct = 0;
            var tips = ['Loading assets...', 'Preparing field...', 'Almost ready...'];
            var tipIdx = 0;
            var iv = setInterval(function() {
                pct += Math.random() * 15 + 5;
                if (pct > 90) pct = 90;
                bar.style.width = pct + '%';
                if (Math.random() > 0.7) {
                    tipIdx = (tipIdx + 1) % tips.length;
                    hint.textContent = tips[tipIdx];
                }
            }, 400);

            window.addEventListener('load', function() {
                setTimeout(function() {
                    bar.style.width = '100%';
                    hint.textContent = 'Ready!';
                    setTimeout(function() {
                        document.getElementById('loading').classList.add('hide');
                        clearInterval(iv);
                    }, 400);
                }, 800);
            });
        })();
    </script>

    <script src="html5game/RetroBowl.js"></script>
    <script>
        window.onload = function() {
            if (typeof GameMaker_Init === 'function') {
                GameMaker_Init();
            }
        };
    </script>
</body>
</html>
